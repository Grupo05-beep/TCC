<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pãodora — Criar conta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:           #f7ecdc;
    --text:         #2b1810;
    --text-muted:   #8a6a4c;
    --gold-light:   #f4cf87;
    --gold:         #d79a3c;
    --gold-deep:    #b97b25;
    --red:          #c1462f;
    --red-bg:       #f6ddd6;
    --bread-color:  #c98a2e;
    --field-bg:     #fffaf0;
    --field-border: rgba(43,24,16,0.16);
  }

  html[data-theme="dark"]{
    --bg:           #170f09;
    --text:         #f7ecdc;
    --text-muted:   #c9a877;
    --gold-light:   #f6d488;
    --gold:         #e8ac45;
    --gold-deep:    #c98a2e;
    --red:          #e2725a;
    --red-bg:       #3a2119;
    --bread-color:  #f0bb63;
    --field-bg:     #241609;
    --field-border: rgba(247,236,220,0.16);
  }

  *{ box-sizing: border-box; }
  html, body{ height: 100%; margin: 0; }

  body{
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
    transition: background-color 320ms ease, color 320ms ease;
  }

  /* ---------- desenhos de pão no fundo ---------- */
  .bg-breads{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    color: var(--bread-color);
    pointer-events: none;
    transition: color 320ms ease;
  }

  /* ---------- alternador de tema ---------- */
  .theme-toggle{
    position: fixed;
    top: 22px;
    right: 22px;
    z-index: 10;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid var(--field-border);
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(90,58,25,0.18);
    transition: transform 160ms ease, background-color 320ms ease;
  }
  .theme-toggle:hover{ transform: scale(1.06); }
  .theme-toggle:active{ transform: scale(0.94); }
  .theme-toggle svg{ width: 22px; height: 22px; }
  .theme-toggle .icon-moon{ display: none; }
  html[data-theme="dark"] .theme-toggle .icon-sun{ display: none; }
  html[data-theme="dark"] .theme-toggle .icon-moon{ display: block; }

  /* ---------- voltar ---------- */
  .back-link{
    position: fixed;
    top: 28px;
    left: 22px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--text-muted);
    text-decoration: none;
  }
  .back-link svg{ width: 18px; height: 18px; }
  .back-link:hover{ color: var(--gold-deep); }

  /* ---------- conteúdo ---------- */
  .stage{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    margin: 90px auto 30px;
    padding: 0 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo-wrap img{
    width: min(56vw, 190px);
    height: auto;
    display: block;
    margin-bottom: 12px;
  }

  h1{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 24px;
    line-height: 1.25;
    margin: 0 0 6px;
    color: var(--text);
  }

  .subtext{
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--text-muted);
    max-width: 34ch;
    margin: 0 0 30px;
  }

  /* ---------- formulário ---------- */
  form{
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
    text-align: left;
  }

  .field label{
    display: block;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
    padding-left: 2px;
  }

  .field input{
    width: 100%;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    background: var(--field-bg);
    border: 1.5px solid var(--field-border);
    border-radius: 14px;
    padding: 13px 16px;
    outline: none;
    transition: border-color 160ms ease, box-shadow 160ms ease, background-color 320ms ease;
  }
  .field input::placeholder{ color: var(--text-muted); opacity: 0.6; font-weight: 600; }
  .field input:focus{
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(217,154,60,0.18);
  }

  /* input de data: acerta a cor do ícone no modo escuro */
  html[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator{
    filter: invert(0.85);
  }

  /* alternador CPF / CNPJ */
  .doc-toggle{
    display: inline-flex;
    background: var(--field-bg);
    border: 1.5px solid var(--field-border);
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 8px;
    gap: 4px;
  }
  .doc-option{
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--text-muted);
    background: transparent;
    padding: 7px 18px;
    border-radius: 999px;
    transition: background-color 160ms ease, color 160ms ease;
  }
  .doc-option.active{
    background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 100%);
    color: #2b1810;
  }

  /* campo de senha com botão de mostrar/ocultar */
  .password-wrap{ position: relative; }
  .password-wrap input{ padding-right: 46px; }
  .toggle-pass{
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
  }
  .toggle-pass svg{ width: 19px; height: 19px; }
  .toggle-pass .icon-eye-off{ display: none; }
  .toggle-pass.showing .icon-eye{ display: none; }
  .toggle-pass.showing .icon-eye-off{ display: block; }

  .btn-submit{
    appearance: none;
    border: none;
    cursor: pointer;
    width: 100%;
    margin-top: 6px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: #2b1810;
    background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 55%, var(--gold-deep) 100%);
    padding: 16px 20px;
    border-radius: 18px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.4) inset,
      0 -3px 6px rgba(0,0,0,0.15) inset,
      0 14px 26px -10px rgba(90,58,25,0.35);
    transition: transform 160ms ease, filter 160ms ease;
  }
  .btn-submit:hover{ filter: brightness(1.05); }
  .btn-submit:active{ transform: translateY(1px) scale(0.98); }
  .btn-submit:focus-visible{ outline: 2px solid var(--gold-deep); outline-offset: 4px; }

  .login-link{
    margin-top: 20px;
    font-size: 13.5px;
    color: var(--text-muted);
    text-decoration: none;
    text-align: center;
  }
  .login-link strong{ color: var(--gold-deep); font-weight: 700; }
  .login-link:hover strong{ text-decoration: underline; }

  /* ---------- estado de sucesso ---------- */
  .success{
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .success.visible{ display: flex; }
  form.hidden{ display: none; }

  .success-icon{
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }
  .success-icon svg{ width: 32px; height: 32px; color: #2b1810; }

  .success .subtext{ margin-bottom: 26px; }

  .btn-voltar{
    display: inline-block;
    text-decoration: none;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: #2b1810;
    background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 100%);
    padding: 13px 28px;
    border-radius: 16px;
  }

  footer{
    position: relative;
    z-index: 1;
    font-family: 'Baloo 2', sans-serif;
    font-size: 13.5px;
    color: var(--gold-deep);
    padding: 30px 0 28px;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }

  @media (max-width: 420px){
    .stage{ margin-top: 78px; padding: 0 20px; }
    h1{ font-size: 21px; }
  }
</style>
</head>
<body>

  <svg class="bg-breads" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 1200" aria-hidden="true">
    <defs>
      <symbol id="bread" viewBox="0 0 64 64">
        <path d="M8 34c0-14 10-22 24-22s24 8 24 22c0 9-6 15-14 17H22c-8-2-14-8-14-17z" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M20 22c3-3 8-5 12-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path d="M34 20c3 0 7 2 9 5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </symbol>
    </defs>
    <use href="#bread" x="40"   y="60"   width="80" transform="rotate(-12 80 100)"   opacity="0.22"/>
    <use href="#bread" x="960"  y="30"   width="100" transform="rotate(8 1010 80)"   opacity="0.24"/>
    <use href="#bread" x="170"  y="230"  width="60" transform="rotate(20 200 260)"   opacity="0.16"/>
    <use href="#bread" x="1030" y="250"  width="65" transform="rotate(-18 1062 282)" opacity="0.20"/>
    <use href="#bread" x="480"  y="120"  width="55" transform="rotate(-8 507 147)"   opacity="0.14"/>
    <use href="#bread" x="50"   y="510"  width="90" transform="rotate(6 95 555)"     opacity="0.18"/>
    <use href="#bread" x="990"  y="550"  width="80" transform="rotate(-10 1030 590)" opacity="0.16"/>
    <use href="#bread" x="700"  y="480"  width="55" transform="rotate(14 727 507)"   opacity="0.12"/>
    <use href="#bread" x="20"   y="820"  width="65" transform="rotate(-22 52 852)"   opacity="0.20"/>
    <use href="#bread" x="1050" y="870"  width="95" transform="rotate(14 1097 917)"  opacity="0.18"/>
    <use href="#bread" x="510"  y="30"   width="70" transform="rotate(-6 545 65)"    opacity="0.16"/>
    <use href="#bread" x="550"  y="1080" width="100" transform="rotate(10 600 1130)" opacity="0.20"/>
    <use href="#bread" x="140"  y="1000" width="60" transform="rotate(18 170 1030)"  opacity="0.14"/>
    <use href="#bread" x="950"  y="1040" width="65" transform="rotate(-14 982 1072)" opacity="0.18"/>
    <use href="#bread" x="330"  y="900"  width="50" transform="rotate(10 355 925)"   opacity="0.12"/>
    <use href="#bread" x="780"  y="180"  width="50" transform="rotate(-16 805 205)"  opacity="0.14"/>
  </svg>


    
    <a class="back-link" href= "homePageIndex.html"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Voltar
  </a>

  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar modo claro e escuro">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.5"/>
      <path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
    </svg>
  </button>

  <main class="stage">
    <div class="logo-wrap">
      <img id="logoImg" src="logo-light.png" alt="Pãodora — Pão todo dia, histórias todo dia">
    </div>

    <div id="formView">
      <h1>Crie sua conta</h1>
      <p class="subtext">Leve pedidos, clientes e fiado da sua padaria para um só lugar.</p>

      <form id="cadastroForm" novalidate>
        <div class="field">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" placeholder="Como podemos te chamar?" required>
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="voce@email.com">
        </div>

        <div class="field">
          <label for="nascimento">Data de nascimento</label>
          <input id="nascimento" name="nascimento" type="date" required>
        </div>

        <div class="field">
          <label>CPF ou CNPJ</label>
          <div class="doc-toggle" role="tablist">
            <button type="button" class="doc-option active" data-type="cpf">CPF</button>
            <button type="button" class="doc-option" data-type="cnpj">CNPJ</button>
          </div>
          <input id="documento" name="documento" type="text" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" required>
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <div class="password-wrap">
            <input id="senha" name="senha" type="password" placeholder="Crie uma senha" minlength="6" required>
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar senha">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a20.6 20.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
        </div>

        <button class="btn-submit" type="submit">Criar conta</button>
      </form>

      <a class="login-link" href="#">Já tem conta? <strong>Entrar</strong></a>
    </div>

    <div id="successView" class="success">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h1 id="successTitle">Conta criada!</h1>
      <p class="subtext">Seu cadastro na Pãodora foi recebido. Em breve você já pode organizar a padaria por aqui.</p>
   
    </div>
  </main>

  <footer>O seu sistema amigo.</footer>

  <script>
    const root = document.documentElement;
    const toggleBtn = document.getElementById('themeToggle');
    const logoImg = document.getElementById('logoImg');

    function updateLogo(theme){
      logoImg.src = theme === 'dark' ? 'logo-dark.png' : 'logo-light.png';
    }

    toggleBtn.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      updateLogo(next);
    });

    
    const docButtons = document.querySelectorAll('.doc-option');
    const docInput = document.getElementById('documento');
    let docType = 'cpf';

    function maskCPF(v){
      v = v.replace(/\D/g,'').slice(0,11);
      v = v.replace(/(\d{3})(\d)/,'$1.$2');
      v = v.replace(/(\d{3})(\d)/,'$1.$2');
      v = v.replace(/(\d{3})(\d{1,2})$/,'$1-$2');
      return v;
    }
    function maskCNPJ(v){
      v = v.replace(/\D/g,'').slice(0,14);
      v = v.replace(/(\d{2})(\d)/,'$1.$2');
      v = v.replace(/(\d{3})(\d)/,'$1.$2');
      v = v.replace(/(\d{3})(\d)/,'$1/$2');
      v = v.replace(/(\d{4})(\d{1,2})$/,'$1-$2');
      return v;
    }

    docButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        docButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        docType = btn.dataset.type;
        docInput.value = '';
        docInput.placeholder = docType === 'cpf' ? '000.000.000-00' : '00.000.000/0000-00';
        docInput.maxLength = docType === 'cpf' ? 14 : 18;
      });
    });

    docInput.addEventListener('input', (e) => {
      e.target.value = docType === 'cpf' ? maskCPF(e.target.value) : maskCNPJ(e.target.value);
    });

    /* mostrar / ocultar senha */
    const togglePass = document.getElementById('togglePass');
    const senhaInput = document.getElementById('senha');
    togglePass.addEventListener('click', () => {
      const showing = senhaInput.type === 'text';
      senhaInput.type = showing ? 'password' : 'text';
      togglePass.classList.toggle('showing', !showing);
      togglePass.setAttribute('aria-label', showing ? 'Mostrar senha' : 'Ocultar senha');
    });


    const form = document.getElementById('cadastroForm');
    const formView = document.getElementById('formView');
    const successView = document.getElementById('successView');
    const successTitle = document.getElementById('successTitle');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if(!form.checkValidity()){
        form.reportValidity();
        return;
      }
      const primeiroNome = document.getElementById('nome').value.trim().split(' ')[0];
      successTitle.textContent = primeiroNome ? `Bem-vindo(a), ${primeiroNome}!` : 'Conta criada!';
      formView.style.display = 'none';
      successView.classList.add('visible');
    });
  </script>
</body>
</html>
